<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard-movie"></ion-back-button>
    </ion-buttons>
    <ion-title>Favorites</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Favorites</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    @for(favorite of favorites  ; track $index){

      <ion-item >
        <ion-label>
          <h2>{{ favorite.author }}</h2>
          <p>{{ favorite.title }}</p>
        </ion-label>
        <ion-button 
        slot="end" 
        fill="solid" 
        color="danger" 
        (click)="deleteFavorite(favorite.id)">
        <ion-icon slot="icon-only" name="trash"></ion-icon>
      </ion-button>
      </ion-item>
    }
  </ion-list>
</ion-content>
