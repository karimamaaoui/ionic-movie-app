<ion-content class="welcome-content">
  <div class="login-container">
    <h1>Welcome</h1>
    <p class="subtitle">Register to continue exploring</p>

    <!-- Form Wrapper -->
    <form (ngSubmit)="onRegister()">
      
      <!-- Email or Username Input -->
      <ion-item class="input-item">
        <ion-input
          placeholder="Email or Username"
          [(ngModel)]="email"
          name="email"
          required
        ></ion-input>
      </ion-item>

      <!-- Password Input -->
      <ion-item class="input-item">
        <ion-input
          type="password"
          placeholder="Password"
          [(ngModel)]="password"
          name="password"
          required
        ></ion-input>
      </ion-item>

      <!-- Register Button -->
      <ion-button expand="block" shape="round" size="large" type="submit">
        <ion-icon name="log-in-outline" slot="start"></ion-icon>
        Register
      </ion-button>
    </form>

    <div class="divider">
      <span>Or login via</span>
    </div>
    <div class="register-message">
      <p>Already have an account? <a routerLink="/login">Login here</a></p>
    </div>

    <div class="social-buttons">
      <ion-button fill="clear">
        <ion-icon name="logo-facebook" color="primary"></ion-icon>
      </ion-button>
      <ion-button fill="clear">
        <ion-icon name="logo-google" color="danger"></ion-icon>
      </ion-button>
    </div>
  </div>
</ion-content>
