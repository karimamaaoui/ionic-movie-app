<ion-content class="welcome-content">
  <div class="welcome-container">
    <div class="header">
      <img src="assets/wlc_book.png" alt="Welcome Image" class="welcome-image" />
      <h1>Welcome</h1>
      <p class="subtitle">Join our platform to connect and share with the world.</p>
    </div>

    <div class="button-group">
      <ion-button expand="block" shape="round" size="large" routerLink="/login">
        <ion-icon name="log-in-outline" slot="start"></ion-icon>
        Login
      </ion-button>
      <ion-button expand="block" shape="round" size="large" color="tertiary" routerLink="/register">
        <ion-icon name="person-add-outline" slot="start"></ion-icon>
        Sign Up
      </ion-button>
    </div>

    <div class="divider">
      <span>Or connect with</span>
    </div>

    <div class="social-buttons">
      <ion-button fill="clear" size="large">
        <ion-icon name="logo-facebook" color="primary"></ion-icon>
      </ion-button>
      <ion-button fill="clear" size="large">
        <ion-icon name="logo-google" color="danger"></ion-icon>
      </ion-button>
    </div>
  </div>
</ion-content>
