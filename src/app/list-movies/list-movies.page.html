
<ion-content>
  <div class="search-container">
    <ion-item>
      <ion-input [(ngModel)]="searchQuery" placeholder="Search for movies" clearInput></ion-input>
    </ion-item>
    <ion-button expand="block" shape="round" size="medium">
      Search
    </ion-button>
  </div>

  <!-- Display movies -->
  <div *ngIf="movies.length > 0">
    <ion-list>
      <ion-item *ngFor="let movie of getPaginatedMovies()">
        <ion-thumbnail slot="start">
          <img [src]="movie.Poster" alt="movie Cover"/>
        </ion-thumbnail>
        <ion-label>
          <h2>{{ movie.title }}</h2>
          <p>Title: {{ movie.Title }}</p>
          <p>Year Published: {{ movie.Year}}</p>
          <p>Type: {{ movie.Type  }}</p>
        </ion-label>
      </ion-item>
    </ion-list>
  </div>

  <!-- Display Next Button -->
  <div *ngIf="movies.length > 0 && (currentPage + 1) * moviesPerPage < movies.length">
    <ion-button expand="block" (click)="loadNextPage()">Next</ion-button>
  </div>

</ion-content>
