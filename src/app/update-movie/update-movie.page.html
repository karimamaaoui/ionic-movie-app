<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashborad-movie"></ion-back-button>
    </ion-buttons>
    <ion-title>Update Movie</ion-title>
  </ion-toolbar>
</ion-header>


<ion-content>
  <form (ngSubmit)="updateMovie()">
    <ion-item>
      <ion-label position="floating">Title</ion-label>
      <ion-input [(ngModel)]="title" name="title" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Author</ion-label>
      <ion-input [(ngModel)]="author" name="author" required></ion-input>
    </ion-item>

    <ion-button expand="full" type="submit" color="primary">Update Movie</ion-button>
  </form>
</ion-content>
